name: ci

# Standalone open-business blueprint (not west-registered). Deps reference
# sibling repos via :local/root (../../kotoba-lang/langgraph, .../langchain,
# .../langchain-store). All three are PUBLIC, so the test job reconstructs
# the workspace layout by checking them out into the expected relative
# paths — no token needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }
      - name: clj-kondo (errors fail the build)
        run: clojure -M:lint
